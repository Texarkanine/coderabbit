# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en"

early_access: false

reviews:
  path_filters:
    - "!.cursor/rules/shared/**/*"
    - "!.cursor/skills/shared/**/*"
    - "!.cursor/commands/shared/**/*"
    - "!.claude/rules/shared/**/*"
    - "!memory-bank/**/*"
    - "memory-bank/archive/**/*"
  path_instructions:
    - path: "**/*.md"
      instructions: Never mention violations of the following markdownlint rules: MD040, MD048. These rules are not universally-correct and should not even be in the linter; warning about them is a waste of time.

